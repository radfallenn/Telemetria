name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ai-studio-gt7-telemetry

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Conferir estrutura
        run: |
          echo "Arquivos na raiz:"
          ls -la
          echo "Arquivos em www:"
          ls -la www

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Aplicar patches do app
        run: |
          node scripts/patch-index.js
          node scripts/rad-session-patch.js
          node scripts/rad-customizer-patch.js
          node scripts/rad-budget-style-customizer-patch.js
          node scripts/rad-tach-image-styles-patch.js
          node scripts/rad-tach-rebuild-v2-patch.js
          node scripts/rad-ui-clean-actions-v3-patch.js
          node scripts/rad-persistent-cache-patch.js
          node scripts/rad-fix-rpm-laps-autoconnect-v4.js
          node scripts/rad-zero-save-section-v5.js
          node scripts/rad-set-menu-clean-v6.js
          node scripts/rad-audit-hardening-v7.js
          node scripts/rad-stable-laps-nav-v8.js
          node scripts/rad-remove-live-wait-v9.js
          node scripts/rad-force-set-nav-v10.js
          node scripts/rad-close-buttons-v12.js
          node scripts/rad-udm-performance-v13.js
          node scripts/rad-stop-flicker-manual-v14.js
          node scripts/rad-dom-stabilizer-v15.js
          node scripts/rad-core-udm-v16.js
          node scripts/rad-connection-recovery-v17.js

      - name: Validar app montado
        run: node scripts/validate-built-app.js

      - name: Criar projeto Android se necessário
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Pasta android já existe"
          fi

      - name: Sincronizar app web com Android
        run: npx cap sync android

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Gerar APK Debug
        run: cd android && ./gradlew clean assembleDebug --stacktrace

      - name: Enviar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: GT7-Telemetria-v1.80-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
