name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Conferir estrutura do projeto
        run: |
          echo "Arquivos na raiz:"
          ls -la
          echo "Arquivos em www:"
          ls -la www

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android se necessário
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Pasta android já existe"
          fi

      - name: Sincronizar app web com Android
        run: npx cap sync android

      - name: Conferir projeto Android
        run: |
          echo "Versao Java:"
          java -version
          echo "Arquivos em android:"
          ls -la android
          echo "Arquivos APK esperados depois do build:"
          ls -la android/app || true

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Gerar APK Debug
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Enviar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: GT7-Telemetria-v1.58-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
