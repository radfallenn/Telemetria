name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ai-studio-gt7-telemetry

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Conferir estrutura
        run: |
          echo "Arquivos na raiz:"
          ls -la
          echo "Arquivos em www:"
          ls -la www

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Aplicar patches do app
        run: |
          node scripts/patch-index.js
          node scripts/rad-session-patch.js
          node scripts/rad-customizer-patch.js
          node scripts/rad-budget-style-customizer-patch.js
          node scripts/rad-tach-image-styles-patch.js
          node scripts/rad-tach-rebuild-v2-patch.js
          node scripts/rad-ui-clean-actions-v3-patch.js
          node scripts/rad-persistent-cache-patch.js
          grep -o "INICIAR SEÇÃO\|SALVAR SEÇÃO\|VOLTAS CORRIGIDAS\|RAD_CUSTOMIZER_V1\|RAD_BUDGET_STYLE_CUSTOMIZER_V1\|RAD_TACH_IMAGE_STYLES_V1\|RAD_TACH_REBUILD_V2\|RAD_UI_CLEAN_ACTIONS_V3\|RAD_PERSISTENT_CACHE_V1" www/index.html || true
          if grep -q "RAD_AUTO_CONNECT_V2" www/index.html; then
            echo "ERRO: auto conectar ainda existe"
            exit 1
          fi

      - name: Criar projeto Android se necessário
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Pasta android já existe"
          fi

      - name: Sincronizar app web com Android
        run: |
          npx cap sync android
          echo "Verificando index copiado para o Android:"
          grep -o "INICIAR SEÇÃO\|SALVAR SEÇÃO\|VOLTAS CORRIGIDAS\|RAD_CUSTOMIZER_V1\|RAD_BUDGET_STYLE_CUSTOMIZER_V1\|RAD_TACH_IMAGE_STYLES_V1\|RAD_TACH_REBUILD_V2\|RAD_UI_CLEAN_ACTIONS_V3\|RAD_PERSISTENT_CACHE_V1" android/app/src/main/assets/public/index.html || true
          if grep -q "CARRO / PISTA" android/app/src/main/assets/public/index.html; then
            echo "ERRO: card CARRO / PISTA ainda existe"
            exit 1
          fi
          if grep -q "RAD_AUTO_CONNECT_V2" android/app/src/main/assets/public/index.html; then
            echo "ERRO: auto conectar ainda existe"
            exit 1
          fi

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Gerar APK Debug
        run: cd android && ./gradlew clean assembleDebug --stacktrace

      - name: Enviar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: GT7-Telemetria-v1.66-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
