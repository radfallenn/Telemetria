name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Conferir estrutura e tela atual
        run: |
          echo "Arquivos na raiz:"
          ls -la
          echo "Arquivos em www:"
          ls -la www
          echo "Marcadores esperados no app:"
          grep -o "MÉDIA DE TEMPO\|MELHOR VOLTA\|ÚLTIMA VOLTA\|TEMPO TOTAL\|VOLTAS CORRIGIDAS" www/index.html || true

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Aplicar patch visual e auto conexao
        run: node scripts/patch-index.js

      - name: Criar projeto Android se necessário
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Pasta android já existe"
          fi

      - name: Sincronizar app web com Android
        run: |
          node scripts/patch-index.js
          npx cap sync android
          echo "Verificando index copiado para o Android:"
          grep -o "MÉDIA DE TEMPO\|MELHOR VOLTA\|ÚLTIMA VOLTA\|TEMPO TOTAL\|VOLTAS CORRIGIDAS" android/app/src/main/assets/public/index.html || true
          if grep -q "CARRO / PISTA" android/app/src/main/assets/public/index.html; then
            echo "ERRO: card CARRO / PISTA ainda existe"
            exit 1
          fi
          grep -q "scheduleReconnect" android/app/src/main/assets/public/index.html

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Gerar APK Debug
        run: cd android && ./gradlew clean assembleDebug --stacktrace

      - name: Enviar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: GT7-Telemetria-v1.58-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
